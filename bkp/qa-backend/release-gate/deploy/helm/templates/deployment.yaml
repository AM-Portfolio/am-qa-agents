apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-agent-gateway
  labels:
    app: qa-agent-gateway
    app.kubernetes.io/name: qa-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: qa-agent-gateway
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app: qa-agent-gateway
        app.kubernetes.io/name: qa-agent
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["am-qa-agent-gateway"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: QA_AGENT_STORE
              value: "sqlite"
            - name: QA_AGENT_SQLITE_PATH
              value: "{{ .Values.persistence.mountPath }}/qa-agent.db"
            - name: QA_AGENT_ARTIFACT_DIR
              value: "{{ .Values.persistence.mountPath }}/artifacts/pdf"
            {{- end }}
            - name: QA_AGENT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.apiToken }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.githubToken }}
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.githubWebhookSecret }}
                  optional: true
            - name: QA_AGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.databaseUrl }}
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.langfusePublicKey }}
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.langfuseSecretKey }}
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: qa-agent-gateway-data
        {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qa-agent-gateway-data
  labels:
    app: qa-agent-gateway
    app.kubernetes.io/name: qa-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: qa-agent-gateway
  labels:
    app: qa-agent-gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    app: qa-agent-gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-agent-worker
  labels:
    app: qa-agent-worker
    app.kubernetes.io/name: qa-agent
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: qa-agent-worker
  template:
    metadata:
      labels:
        app: qa-agent-worker
        app.kubernetes.io/name: qa-agent
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["am-qa-agent-worker"]
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: TEMPORAL_HOST
              value: {{ .Values.worker.temporal.host | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.worker.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.worker.temporal.taskQueue | quote }}
            - name: QA_AGENT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.apiToken }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
