[project]
name = "am-qa-agent"
version = "0.1.0"
description = "qa-agent — commit-driven release readiness orchestrator (Phases 0–4)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
temporal = [
  "temporalio>=1.7,<2",
]
pdf = [
  "weasyprint>=62,<70",
  "xhtml2pdf>=0.2.16,<1",
]
all = [
  "am-qa-agent[temporal,pdf,dev]",
]

[project.scripts]
am-qa-agent-gateway = "am_qa_agent.gateway.app:main"
am-qa-agent-worker = "am_qa_agent.orchestrator.worker_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/am_qa_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
