# Dev Kind (am-dev-apps) — QA portal on https://ai-dev.asrax.in
# API stays same-origin via /qa → am-qa-agents-dev
# Apply: kubectl --kubeconfig ~/.asrax/kubeconfig.dev.local -n am-agents-dev apply -f qa-portal-ui/k8s/dev.yaml
apiVersion: v1
kind: Service
metadata:
  name: am-qa-portal-ui-dev
  namespace: am-agents-dev
  labels:
    app.kubernetes.io/name: am-qa-portal-ui
    app.kubernetes.io/instance: am-qa-portal-ui-dev
spec:
  selector:
    app.kubernetes.io/instance: am-qa-portal-ui-dev
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-qa-portal-ui-dev
  namespace: am-agents-dev
  labels:
    app.kubernetes.io/name: am-qa-portal-ui
    app.kubernetes.io/instance: am-qa-portal-ui-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: am-qa-portal-ui-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: am-qa-portal-ui
        app.kubernetes.io/instance: am-qa-portal-ui-dev
    spec:
      imagePullSecrets:
        - name: ghcr-creds
        - name: github-registry-secret
        - name: regcred
      containers:
        - name: portal
          image: ghcr.io/am-portfolio/am-qa-agents/am-qa-portal-ui:local-dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Portal UI at https://ai-dev.asrax.in/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: am-qa-portal-ui-dev
  namespace: am-agents-dev
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "50"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-agents-dev-dev-global-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ai-dev.asrax.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: am-qa-portal-ui-dev
                port:
                  number: 80
---
# Legacy am-dev.asrax.in/qa/ui → https://ai-dev.asrax.in/
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-qa-ui-to-ai-dev
  namespace: am-agents-dev
spec:
  redirectRegex:
    regex: ^https?://[^/]+/qa/ui/?.*
    replacement: https://ai-dev.asrax.in/
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: am-qa-portal-ui-legacy-redirect
  
  namespace: am-agents-dev
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "210"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-agents-dev-redirect-qa-ui-to-ai-dev@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: am-dev.asrax.in
      http:
        paths:
          - path: /qa/ui
            pathType: Prefix
            backend:
              service:
                name: am-qa-portal-ui-dev
                port:
                  number: 80
---
# QA API on ai-dev host (same-origin /qa for the portal)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: am-qa-agents-ai-dev
  namespace: am-agents-dev
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-agents-dev-dev-global-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ai-dev.asrax.in
      http:
        paths:
          - path: /qa
            pathType: Prefix
            backend:
              service:
                name: am-qa-agents-dev
                port:
                  number: 8150
          - path: /ui-test
            pathType: Prefix
            backend:
              service:
                name: am-qa-agents-dev
                port:
                  number: 8150
