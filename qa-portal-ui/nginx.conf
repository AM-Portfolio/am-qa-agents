server {
  listen 8080;
  server_name _;
  # Flutter --base-href=/qa/ui/ expects assets at /qa/ui/*
  root /usr/share/nginx/html;
  index index.html;

  location = /qa/ui {
    return 301 /qa/ui/;
  }

  location /qa/ui/ {
    try_files $uri $uri/ /qa/ui/index.html;
  }

  location / {
    return 301 /qa/ui/;
  }
}
