server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Traefik TLS: relative Location headers only
  absolute_redirect off;
  port_in_redirect off;

  # SPA at host root (https://ai-dev.asrax.in / https://ai.asrax.in)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
