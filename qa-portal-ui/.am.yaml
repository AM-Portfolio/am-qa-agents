# Dig/laptop deploy: Flutter portal only (nginx). Backend stays am-qa-agents.
# Public hosts: https://ai-dev.asrax.in (dev) · https://ai.asrax.in (prod)
#
#   cd qa-portal-ui
#   flutter build web --release --base-href=/ --dart-define=API_BASE=/qa --dart-define=ROOT_PATH=/qa
#   docker build -t … . && kind load … && kubectl apply -f k8s/dev.yaml

name: am-qa-portal-ui
release: am-qa-portal-ui
runtime: static
language: flutter
dockerfile: Dockerfile
context: .
image: ghcr.io/am-portfolio/am-qa-agents/am-qa-portal-ui
github:
  repo: AM-Portfolio/am-qa-agents
  service: am-qa-portal-ui
  ref: main
deploy:
  via: helm
  rebuild: always
