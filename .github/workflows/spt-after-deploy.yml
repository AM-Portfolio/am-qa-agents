# Post-deploy Commit→SPT — separate from Contabo publish so it can be removed/migrated easily.
# Contabo (or market-data) calls this via workflow_call after a successful env deploy.
# This workflow only POSTs /v2/workflows/commit-spt; k6 runs on the qa-agent Temporal worker.

name: SPT after deploy (Temporal start)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string
        description: "dev | preprod | prod (dr is skipped)"
      git_ref:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      committer_email:
        required: false
        type: string
        default: ""
      committer_name:
        required: false
        type: string
        default: ""
      repo:
        required: false
        type: string
        default: ""
      github_run_id:
        required: false
        type: string
        default: ""
      github_run_url:
        required: false
        type: string
        default: ""
      github_workflow:
        required: false
        type: string
        default: ""
      github_event_name:
        required: false
        type: string
        default: ""
      commit_message:
        required: false
        type: string
        default: ""
    secrets:
      QA_AGENT_GATEWAY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: string
        default: "am-market-data"
      environment:
        required: true
        type: choice
        options: [dev, preprod, prod]
        default: "dev"
      git_ref:
        required: true
        type: string
        default: "main"
      git_sha:
        required: false
        type: string
        default: ""
      committer_email:
        required: false
        type: string
        default: ""
      committer_name:
        required: false
        type: string
        default: ""

jobs:
  start-temporal:
    name: Start CommitSpt (${{ inputs.service }} / ${{ inputs.environment }})
    if: ${{ inputs.environment == 'dev' || inputs.environment == 'preprod' || inputs.environment == 'prod' }}
    # ubuntu-latest: org has no self-hosted runners; public dig URL works (in-cluster preferred when on-cluster).
    runs-on: ubuntu-latest
    steps:
      - name: Resolve QA base URL + POST commit-spt
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          QA_AGENT_GATEWAY_TOKEN: ${{ secrets.QA_AGENT_GATEWAY_TOKEN }}
          SERVICE: ${{ inputs.service }}
          GIT_REF: ${{ inputs.git_ref }}
          GIT_SHA: ${{ inputs.git_sha || github.sha }}
          COMMITTER_EMAIL: ${{ inputs.committer_email }}
          COMMITTER_NAME: ${{ inputs.committer_name }}
          REPO: ${{ inputs.repo || github.repository }}
          GITHUB_RUN_ID_IN: ${{ inputs.github_run_id || github.run_id }}
          GITHUB_RUN_URL_IN: ${{ inputs.github_run_url }}
          GITHUB_WORKFLOW_IN: ${{ inputs.github_workflow || github.workflow }}
          GITHUB_EVENT_IN: ${{ inputs.github_event_name || github.event_name }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          CALLER_SERVER_URL: ${{ github.server_url }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ENV="${ENVIRONMENT}"
          case "$ENV" in
            dev) BASE="https://am-dev.asrax.in/qa" ;;
            preprod) BASE="https://am-preprod.asrax.in/qa" ;;
            prod) BASE="https://am.asrax.in/qa" ;;
            *)
              echo "::error::Unsupported environment for SPT: $ENV (use dev|preprod|prod)"
              exit 1
              ;;
          esac
          # Prefer in-cluster URL on self-hosted runners (avoid CF 1010).
          if [[ "$ENV" == "dev" ]] && [[ -n "${KUBERNETES_SERVICE_HOST:-}" || -d /var/run/secrets/kubernetes.io ]]; then
            if curl -sf -m 2 "http://am-qa-agents-dev.am-agents-dev.svc.cluster.local:8150/health" >/dev/null 2>&1; then
              BASE="http://am-qa-agents-dev.am-agents-dev.svc.cluster.local:8150"
            elif curl -sf -m 2 "http://am-qa-agents.am-agents-dev.svc.cluster.local:8150/health" >/dev/null 2>&1; then
              BASE="http://am-qa-agents.am-agents-dev.svc.cluster.local:8150"
            fi
          fi
          test -n "${QA_AGENT_GATEWAY_TOKEN:-}" || { echo "::error::QA_AGENT_GATEWAY_TOKEN required"; exit 1; }
          RUN_URL="${GITHUB_RUN_URL_IN:-}"
          if [[ -z "$RUN_URL" && -n "${GITHUB_RUN_ID_IN:-}" ]]; then
            RUN_URL="${CALLER_SERVER_URL}/${CALLER_REPO}/actions/runs/${GITHUB_RUN_ID_IN}"
          fi
          export RUN_URL
          BODY=$(python3 - <<'PY'
          import json, os
          msg = (os.environ.get("COMMIT_MESSAGE") or "").strip()
          if len(msg) > 200:
              msg = msg[:197] + "..."
          print(json.dumps({
            "service": os.environ["SERVICE"],
            "repo": os.environ.get("REPO") or "",
            "branch": os.environ["GIT_REF"],
            "head_sha": os.environ["GIT_SHA"],
            "environment": os.environ.get("ENVIRONMENT") or "dev",
            "committer_email": os.environ.get("COMMITTER_EMAIL") or None,
            "committer_name": os.environ.get("COMMITTER_NAME") or None,
            "use_temporal": True,
            "trigger_source": "github_actions",
            "github_run_id": os.environ.get("GITHUB_RUN_ID_IN") or None,
            "github_run_url": os.environ.get("RUN_URL") or None,
            "github_workflow": os.environ.get("GITHUB_WORKFLOW_IN") or None,
            "github_event_name": os.environ.get("GITHUB_EVENT_IN") or None,
            "commit_message": msg or None,
          }))
          PY
          )
          echo "POST $BASE/v2/workflows/commit-spt (env=$ENV)"
          echo "$BODY"
          curl -sS -f -X POST "$BASE/v2/workflows/commit-spt" \
            -H "Authorization: Bearer ${QA_AGENT_GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo
          echo "Started Temporal CommitSptWorkflow — SPT executes on qa-agent worker (not this runner)."
