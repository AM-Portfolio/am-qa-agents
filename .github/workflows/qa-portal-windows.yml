name: Publish — qa-portal-ui Windows

on:
  push:
    tags:
      - "qa-portal-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override pack version (semver). Empty = pubspec version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Build + Velopack pack
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout am-qa-agents
        uses: actions/checkout@v4
        with:
          path: am-qa-agents

      - name: Checkout am-modern-ui (design system)
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-modern-ui
          path: am-modern-ui
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install vpk
        run: dotnet tool update -g vpk

      - name: Pub get
        working-directory: am-qa-agents/qa-portal-ui
        run: flutter pub get

      - name: Analyze
        working-directory: am-qa-agents/qa-portal-ui
        run: flutter analyze --no-fatal-infos

      - name: Resolve version
        id: ver
        working-directory: am-qa-agents/qa-portal-ui
        run: |
          $override = "${{ github.event.inputs.version }}"
          if ($override) {
            $v = $override.Trim()
          } elseif ($env:GITHUB_REF -match 'refs/tags/qa-portal-v(.+)$') {
            $v = $Matches[1]
          } else {
            $line = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1)
            $v = (($line -replace '^version:\s*', '').Trim() -split '\+')[0]
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Pack version=$v"

      - name: Build Windows + Velopack pack
        working-directory: am-qa-agents/qa-portal-ui
        env:
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certPath = ""
          if ($env:WINDOWS_CERT_PFX_B64) {
            $certPath = Join-Path $env:RUNNER_TEMP "qaportal-codesign.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_B64))
          }
          $packArgs = @{
            Version = "${{ steps.ver.outputs.version }}"
          }
          if ($certPath) {
            $packArgs.CertPfx = $certPath
            $packArgs.CertPassword = $env:WINDOWS_CERT_PASSWORD
          }
          & .\scripts\pack-windows.ps1 @packArgs

      - name: Upload Releases artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-portal-windows-releases
          path: am-qa-agents/qa-portal-ui/dist/windows/Releases

      - name: Upload download-page bundle (Setup + manifest)
        uses: actions/upload-artifact@v4
        with:
          name: qa-portal-download-desktop
          path: |
            am-qa-agents/qa-portal-ui/download/desktop/QAPortal-win-Setup.exe
            am-qa-agents/qa-portal-ui/download/desktop-release.json
            am-qa-agents/qa-portal-ui/desktop-release.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/qa-portal-v')
        working-directory: am-qa-agents/qa-portal-ui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $dir = "dist/windows/Releases"
          $files = Get-ChildItem $dir -File | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No release files in $dir" }
          $setup = Join-Path "download/desktop" "QAPortal-win-Setup.exe"
          if (Test-Path $setup) { $files += (Resolve-Path $setup).Path }
          $notes = @"
          ## QA Portal Windows $tag

          - **Operators:** open ``/qa/download`` on preprod/prod after the next qa-agent image deploy, or download **QAPortal-win-Setup.exe** below.
          - Thin installer + Velopack update feed from this release.
          "@
          gh release create $tag @files `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "QA Portal Windows $tag" `
            --notes $notes
