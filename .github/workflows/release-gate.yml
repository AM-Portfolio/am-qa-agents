name: Publish — release-gate

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "qa-backend/release-gate/**"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "qa-backend/release-gate/**"
  workflow_dispatch:

jobs:
  test:
    name: Test release-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-backend/release-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Import check
        run: python -c "from am_qa_agent.gateway.app import app; print(getattr(app, 'title', 'ok'))"
      - name: Pytest
        run: pytest -q

  publish:
    name: Publish release-gate (am-qa-agent)
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: python
      working_directory: qa-backend/release-gate
      image_name: am-qa-agent
      build_context: "."
      deploy_dev: false
      deploy_preprod: false
      deploy_prod: false
    secrets: inherit
