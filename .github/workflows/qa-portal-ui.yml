name: Publish — qa-portal-ui

on:
  push:
    branches: ["main", "develop", "feature/**"]
    paths:
      - "qa-portal-ui/**"
      - ".github/workflows/qa-portal-ui.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "qa-portal-ui/**"
  workflow_dispatch:

jobs:
  build:
    name: Analyze + build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout am-qa-agents
        uses: actions/checkout@v4
        with:
          path: am-qa-agents

      - name: Checkout am-modern-ui (design system)
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-modern-ui
          path: am-modern-ui
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # am_design_system / am_common generated sources are gitignored.
      - name: Generate am-modern-ui freezed/json code
        shell: bash
        run: |
          set -euo pipefail
          for pkg in am_common am_design_system; do
            (
              cd "am-modern-ui/$pkg"
              flutter pub get
              dart run build_runner build --delete-conflicting-outputs
            )
          done

      - name: Pub get
        working-directory: am-qa-agents/qa-portal-ui
        run: flutter pub get

      - name: Analyze
        working-directory: am-qa-agents/qa-portal-ui
        run: flutter analyze --no-fatal-infos

      - name: Build web
        working-directory: am-qa-agents/qa-portal-ui
        run: |
          flutter build web --release \
            --base-href=/qa/ui/ \
            --dart-define=API_BASE=/qa \
            --dart-define=ROOT_PATH=/qa \
            --dart-define=KEYCLOAK_ISSUER=https://auth.asrax.in/realms/am-qa-agents-dev \
            --dart-define=KEYCLOAK_CLIENT_ID=am-qa-portal-client \
            --no-wasm-dry-run

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-portal-ui-web
          path: am-qa-agents/qa-portal-ui/build/web
