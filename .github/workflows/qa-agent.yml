name: Publish — qa-agent

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "qa-agent/**"
      - "qa-portal-ui/**"
      - "pyproject.toml"
      - "package.json"
      - "docker/**"
      - ".code-intelligence.yaml"
      - ".github/workflows/qa-agent.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "qa-agent/**"
      - "qa-portal-ui/**"
      - "pyproject.toml"
      - "package.json"
      - "docker/**"
      - ".code-intelligence.yaml"
      - ".github/workflows/qa-agent.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test qa-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev,temporal,pdf]"
      - name: Import check
        env:
          PYTHONPATH: qa-agent:qa-agent/release_gate
        run: python -c "from composition.app import app; print(getattr(app, 'title', 'ok'), len(app.routes))"
      - name: Pytest
        env:
          PYTHONPATH: qa-agent:qa-agent/release_gate
          QA_AGENT_SKIP_OBSERVE: "true"
        run: |
          pytest -q \
            qa-agent/specs/tests/test_env_urls.py \
            qa-agent/release_gate/tests/test_trigger_policy.py \
            qa-agent/release_gate/tests/test_phase2.py \
            qa-agent/release_gate/tests/test_phase3.py \
            qa-agent/ui_evidence/tests/test_env_urls.py

  publish:
    name: Publish qa-agent (am-qa-agents)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout am-qa-agents
        uses: actions/checkout@v4
        with:
          path: am-qa-agents

      - name: Checkout am-modern-ui (design system for portal)
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-modern-ui
          path: am-modern-ui
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_PAT || secrets.AM_GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter portal (cluster)
        id: portal
        continue-on-error: true
        working-directory: am-qa-agents/qa-portal-ui
        run: |
          flutter pub get
          flutter build web --release \
            --base-href=/qa/ui/ \
            --dart-define=API_BASE=/qa \
            --dart-define=ROOT_PATH=/qa \
            --no-wasm-dry-run
          test -f build/web/index.html
          echo "built=true" >> "$GITHUB_OUTPUT"
          du -sh build/web

      - name: Portal bake status
        run: |
          if [ "${{ steps.portal.outcome }}" != "success" ]; then
            echo "::warning::Flutter portal bake failed (am-modern-ui). Publishing agent image without SPA; Specs/k6 still ship."
            rm -rf am-qa-agents/qa-portal-ui/build/web || true
          else
            echo "Portal web assets ready"
            du -sh am-qa-agents/qa-portal-ui/build/web
          fi

      - name: Image tag
        id: meta
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/am-portfolio/am-qa-agents:$TAG" >> "$GITHUB_OUTPUT"

      # Grant this repo Write on the org package (Manage Actions access).
      # Required when the package was first pushed with a PAT (repository: null).
      # Same model as other AM services: GITHUB_TOKEN / GH_TOKEN write, not GHCR_TOKEN
      # (GHCR_TOKEN is org read:packages for base-image pulls only — see am-pipelines).
      - name: Link package → repo (Actions write)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO_ID="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .id)"
          echo "Linking package am-qa-agents → repo id ${REPO_ID}"
          # Matches am-market-data (repository linked). If this 404s, grant Write under
          # Package settings → Manage Actions access → AM-Portfolio/am-qa-agents
          gh api --method PUT \
            "orgs/${OWNER}/packages/container/am-qa-agents/repositories/${REPO_ID}" \
            && echo "linked_ok" || echo "::warning::Link API failed — ensure Manage Actions access Write for this repo"

      - name: Login GHCR (write)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Never prefer GHCR_TOKEN here — it is read:packages and causes write_package.
          password: ${{ secrets.GH_TOKEN || secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Build & push image (includes k6 + portal)
        working-directory: am-qa-agents
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -f qa-agent/Dockerfile \
            -t "ghcr.io/am-portfolio/am-qa-agents:${TAG}" \
            .
          docker push "ghcr.io/am-portfolio/am-qa-agents:${TAG}"

  # Deploy via deploy-qa-agent.yml (workflow_dispatch / Contabo pin).
  # Avoid reusable uses: here — GitHub validates them at startup even when
  # the job if: is false, which produced org-wide startup_failure on Publish.
