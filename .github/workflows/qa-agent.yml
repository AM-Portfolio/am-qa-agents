name: Publish — qa-agent

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**", "hotfix/**", "fix/**"]
    paths:
      - "qa-agent/**"
      - "qa-portal-ui/**"
      - "pyproject.toml"
      - "package.json"
      - "docker/**"
      - ".code-intelligence.yaml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "qa-agent/**"
      - "qa-portal-ui/**"
      - "pyproject.toml"
      - "package.json"
      - "docker/**"
      - ".code-intelligence.yaml"
  workflow_dispatch:

jobs:
  test:
    name: Test qa-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Import check
        env:
          PYTHONPATH: qa-agent:qa-agent/release_gate
        run: python -c "from composition.app import app; print(getattr(app, 'title', 'ok'), len(app.routes))"
      - name: Pytest
        env:
          PYTHONPATH: qa-agent:qa-agent/release_gate
        run: pytest -q qa-agent/specs/tests/test_env_urls.py qa-agent/release_gate/tests/test_trigger_policy.py qa-agent/ui_evidence/tests/test_env_urls.py

  publish:
    name: Publish qa-agent (am-qa-agents)
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@main
    with:
      language: python
      working_directory: "."
      image_name: am-qa-agents
      dockerfile: qa-agent/Dockerfile
      build_context: "."
      deploy_dev: false
      deploy_preprod: false
      deploy_prod: false
    secrets: inherit
