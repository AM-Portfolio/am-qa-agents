# Optional manual fire-and-forget: POST /v2/workflows/commit-spt
# Execution runs on the qa-agent Temporal worker pod — NOT on this runner.
#
# Preferred trigger (no GitHub Actions): GitHub repo webhook →
#   POST https://am-dev.asrax.in/qa/webhooks/github  (push + am-market-data/**)
#
# This workflow only starts Temporal; it does not poll or run k6.

name: SPT on commit (Temporal start)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      git_ref:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      committer_email:
        required: false
        type: string
        default: ""
      committer_name:
        required: false
        type: string
        default: ""
      environment:
        required: false
        type: string
        default: "dev"
      qa_base_url:
        required: false
        type: string
        default: "https://am-dev.asrax.in/qa"
      repo:
        required: false
        type: string
        default: "AM-Portfolio/am-market"
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: string
        default: "am-market-data"
      git_ref:
        required: true
        type: string
        default: "feature/spt-smoke"
      git_sha:
        required: false
        type: string
        default: ""
      committer_email:
        required: false
        type: string
        default: ""
      committer_name:
        required: false
        type: string
        default: ""
      environment:
        required: false
        type: string
        default: "dev"
      qa_base_url:
        required: false
        type: string
        default: "https://am-dev.asrax.in/qa"

jobs:
  start-temporal:
    name: Start CommitSptWorkflow (${{ inputs.service }} / ${{ inputs.git_ref }})
    # Prefer self-hosted so the start POST reaches dig without CF 1010.
    # Job exits after Temporal accept — SPT runs in the qa-agent worker pod.
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: POST /v2/workflows/commit-spt
        env:
          QA_BASE_URL: ${{ inputs.qa_base_url }}
          QA_AGENT_GATEWAY_TOKEN: ${{ secrets.QA_AGENT_GATEWAY_TOKEN }}
          SERVICE: ${{ inputs.service }}
          GIT_REF: ${{ inputs.git_ref }}
          GIT_SHA: ${{ inputs.git_sha || github.sha }}
          COMMITTER_EMAIL: ${{ inputs.committer_email }}
          COMMITTER_NAME: ${{ inputs.committer_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          REPO: ${{ inputs.repo || github.repository }}
        run: |
          set -euo pipefail
          # Prefer in-cluster URL on self-hosted runners (no Cloudflare).
          BASE="${QA_BASE_URL:-http://am-qa-agents.am-agents-dev.svc.cluster.local:8150}"
          if [[ "$BASE" == https://am-dev.asrax.in/* ]] && [[ -n "${KUBERNETES_SERVICE_HOST:-}" || -d /var/run/secrets/kubernetes.io ]]; then
            BASE="http://am-qa-agents-dev.am-agents-dev.svc.cluster.local:8150"
          fi
          # Dig Kind service name may be am-qa-agents-dev
          if curl -sf -m 2 "http://am-qa-agents-dev.am-agents-dev.svc.cluster.local:8150/health" >/dev/null 2>&1; then
            BASE="http://am-qa-agents-dev.am-agents-dev.svc.cluster.local:8150"
          fi
          test -n "${QA_AGENT_GATEWAY_TOKEN:-}" || { echo "::error::QA_AGENT_GATEWAY_TOKEN required"; exit 1; }
          BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "service": os.environ["SERVICE"],
            "repo": os.environ.get("REPO") or "AM-Portfolio/am-market",
            "branch": os.environ["GIT_REF"],
            "head_sha": os.environ["GIT_SHA"],
            "environment": os.environ.get("ENVIRONMENT") or "dev",
            "committer_email": os.environ.get("COMMITTER_EMAIL") or None,
            "committer_name": os.environ.get("COMMITTER_NAME") or None,
            "use_temporal": True,
          }))
          PY
          )
          echo "POST $BASE/v2/workflows/commit-spt"
          echo "$BODY"
          curl -sS -f -X POST "$BASE/v2/workflows/commit-spt" \
            -H "Authorization: Bearer ${QA_AGENT_GATEWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY"
          echo
          echo "Started Temporal CommitSptWorkflow — SPT executes on qa-agent worker (not this runner)."
