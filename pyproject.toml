[project]
name = "am-qa-agents"
version = "0.2.1"
description = "QA monorepo — qa-agent (SPT + UI evidence + release-gate)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.0,<3",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "mcp>=1.0,<2",
  "playwright==1.60.0",
  "langgraph>=0.0.10",
  "langchain-core>=0.2.0",
  "qdrant-client>=1.3.0",
  "motor>=3.3.0",
  "apscheduler>=3.10.1",
  "python-multipart>=0.0.6",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
temporal = ["temporalio>=1.7,<2"]
pdf = ["weasyprint>=62,<70", "xhtml2pdf>=0.2.16,<1"]
otel = [
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp-proto-http>=1.24.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-asgi>=0.45b0",
]
all = ["am-qa-agents[temporal,pdf,dev,otel]"]

[project.scripts]
am-qa-agents = "composition.main:main"
am-qa-agent-gateway = "gateway.app:main"
am-qa-agent-worker = "orchestrator.worker_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Map packages living under qa-agent/
[tool.hatch.build.targets.wheel.force-include]
"qa-agent/composition" = "composition"
"qa-agent/common" = "common"
"qa-agent/gateway" = "gateway"
"qa-agent/orchestrator" = "orchestrator"
"qa-agent/intelligence" = "intelligence"
"qa-agent/learning" = "learning"
"qa-agent/adapters" = "adapters"
"qa-agent/stores" = "stores"
"qa-agent/observability" = "observability"
"qa-agent/runtime" = "runtime"
"qa-agent/spt" = "spt"
"qa-agent/ui_evidence" = "ui_evidence"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["qa-agent/tests"]
pythonpath = ["qa-agent"]
addopts = "--import-mode=importlib"
