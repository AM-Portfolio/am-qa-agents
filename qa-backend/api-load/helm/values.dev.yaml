# Dev overrides for local `am deploy --env dev` (am-apps-dev)
environment: dev
replicaCount: 1

# Vault path apps/data/dev/services/am-spt-poc is not seeded yet — run without injector.
vault:
  enabled: false

ingress:
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-dev-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /spt-poc
          pathType: Prefix

env:
  APP_ENV: dev
  LOG_LEVEL: INFO
  ROOT_PATH: /spt-poc
  DEFAULT_ENVIRONMENT: dev
