# Phase 1 LoadContext environments
environments:
  preprod:
    branch_patterns: ["main", "develop", "release/*"]
    fin_agent_base_url: https://am-dev.asrax.in/fin-agent
    ui_test_agent_base_url: https://am-dev.asrax.in/ui-test
    tool_agent_base_url: https://am-dev.asrax.in/tools
    gnx_mcp_url: https://gitnexus.asrax.in
    gnx_index_mode: job
    code_intelligence_index_url: ""
    block_release_if_gnx_down: false
    default_ui_profile: RELEASE_GATE
    ui_targets:
      main:
        base_url: https://am-dev.asrax.in
        profile: AUTH_FLOW_MAIN
        ui_mode: main
        auth_login_mode: demo
      portfolio:
        base_url: https://am-dev.asrax.in
        profile: AUTH_FLOW_PORTFOLIO
        ui_mode: portfolio
        auth_login_mode: demo
    service_map:
      # am-platform services (not a separate "am-auth" product)
      Identity:
        base_url: https://am-dev.asrax.in/identity
        spec_url: https://am-dev.asrax.in/identity/openapi.json
      User Management:
        base_url: https://am-dev.asrax.in/users
        spec_url: https://am-dev.asrax.in/users/openapi.json
      Auth Tokens:
        base_url: https://am-dev.asrax.in/auth
        spec_url: https://am-dev.asrax.in/auth/openapi.json
      Market Data:
        base_url: https://am-dev.asrax.in/market
        spec_url: https://am-dev.asrax.in/market/v3/api-docs
      Trade Service:
        base_url: https://am-dev.asrax.in/trade
        spec_url: https://am-dev.asrax.in/trade/v3/api-docs
      Analysis Service:
        base_url: https://am-dev.asrax.in/analysis
        spec_url: https://am-dev.asrax.in/analysis/v3/api-docs
      Market Data Parser:
        base_url: https://am-dev.asrax.in/market/parser
        spec_url: https://am-dev.asrax.in/market/parser/v3/api-docs
    credential_refs:
      ui_test: vault://am-apps-preprod/ui-test-agent

  # Pilot target for CI merges (qa-agent.yaml environment: dev)
  dev:
    branch_patterns: ["master", "main", "develop"]
    inherits: preprod
    default_ui_profile: RELEASE_GATE
    credential_refs:
      ui_test: vault://am-apps-dev/ui-test-agent

  feature:
    branch_patterns: ["feature/*", "fix/*", "chore/*"]
    inherits: preprod
    default_ui_profile: SMOKE

  local:
    branch_patterns: ["*"]
    inherits: preprod
    # Prefer public am-dev agents from laptop (no local specialist ports required)
    fin_agent_base_url: https://am-dev.asrax.in/fin-agent
    ui_test_agent_base_url: https://am-dev.asrax.in/ui-test
    tool_agent_base_url: https://am-dev.asrax.in/tools
    gnx_mcp_url: https://gitnexus.asrax.in
    ui_targets:
      main:
        base_url: https://am-dev.asrax.in
        profile: SMOKE
        ui_mode: main
        auth_login_mode: demo
