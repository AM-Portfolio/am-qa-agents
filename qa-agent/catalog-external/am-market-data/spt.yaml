apiVersion: am.spt/v1
kind: ServiceLoadTest
service: am-market-data
label: am-market-data
enabled: true
runtime: unknown
description: Domain feed registration from am-specs (am-market-data)
source:
  repo: am-market
  path: am-market-data/spt.yaml
targets:
  dig: http://am-market-data-dev.am-apps-dev.svc.cluster.local:8080
  public_dev: https://am-dev.asrax.in/market
  dev: https://am-dev.asrax.in/market
  preprod: https://am-preprod.asrax.in/market
  prod: https://am.asrax.in/market
openapi:
  path: /v3/api-docs
