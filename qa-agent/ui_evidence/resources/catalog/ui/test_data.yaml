# ui-test-agent test data — personas only (no product service catalog).
defaults:
  persona: demo_user

personas:
  demo_user:
    login_mode: demo
    description: Default Demo Login
  credentials_user:
    login_mode: credentials
    description: Stable user from TEST_USER_EMAIL / TEST_USER_PASSWORD
  admin_user:
    login_mode: credentials
    description: Admin user from TEST_ADMIN_*
  sandbox_user:
    login_mode: credentials
    description: Write-test user — do not use prod data

backends:
  local:
    all: [target]
  preprod:
    all: [AM_API_BASE_URL]

soft_assert_policy:
  data_dependent: true
  shell_and_route: hard
