# Generic presets only — service registrations come from SPT_CATALOG_EXTERNAL / per-repo spt.yaml.
services: []

environments:
  - dev
  - preprod
  - prod

load_presets:
  smoke:
    vus: 3
    duration: "30s"
  load:
    vus: 10
    duration: "2m"
  "20u-50":
    vus: 20
    iterations: 50
  stress:
    vus: 25
    duration: "5m"
