# repo/path → fin services + ui profile
# Product-specific rules belong in external config mounts, not in this repo.
rules:
  - match:
      paths_any: ["**/*.md", "**/docs/**"]
    fin_services: []
    scenarios: []
    ui_profile: SMOKE
    ui_target: main
    docs_only: true

default:
  fin_services: []
  scenarios: []
  ui_profile: AUTH_FLOW_MAIN
  ui_target: main
