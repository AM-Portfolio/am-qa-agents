# Phase 1 LoadContext environments — agent endpoints only.
# Per-product service_map / targets come from external config (ConfigMap / vault), not baked here.
environments:
  preprod:
    branch_patterns: ["main", "develop", "release/*"]
    fin_agent_base_url: https://am-dev.asrax.in/fin-agent
    ui_test_agent_base_url: https://am-dev.asrax.in/ui-test
    tool_agent_base_url: https://am-dev.asrax.in/tools
    gnx_mcp_url: https://gitnexus.asrax.in
    gnx_index_mode: job
    code_intelligence_index_url: ""
    block_release_if_gnx_down: false
    default_ui_profile: AUTH_FLOW_MAIN
    ui_targets:
      main:
        base_url: https://am-dev.asrax.in
        profile: AUTH_FLOW_MAIN
        ui_mode: main
        auth_login_mode: demo
    service_map: {}
    credential_refs:
      ui_test: vault://am-apps-preprod/ui-test-agent

  dev:
    branch_patterns: ["master", "main", "develop"]
    inherits: preprod
    default_ui_profile: AUTH_FLOW_MAIN
    credential_refs:
      ui_test: vault://am-apps-dev/ui-test-agent

  feature:
    branch_patterns: ["feature/*", "fix/*", "chore/*"]
    inherits: preprod
    default_ui_profile: SMOKE

  local:
    branch_patterns: ["*"]
    inherits: preprod
    fin_agent_base_url: https://am-dev.asrax.in/fin-agent
    ui_test_agent_base_url: https://am-dev.asrax.in/ui-test
    tool_agent_base_url: https://am-dev.asrax.in/tools
    gnx_mcp_url: https://gitnexus.asrax.in
    ui_targets:
      main:
        base_url: https://am-dev.asrax.in
        profile: SMOKE
        ui_mode: main
        auth_login_mode: demo
