# Vault key → env var mappings (no secret values in git).
# Paths are set per-env in values.{dev,preprod,prod}.yaml under vault.secretPaths.
# Dev qa-agent path: apps/data/dev/runtime/modules/qa (domain — not services/<repo>).

vault:
  secretPaths:
    # qa-agent path+keys come from values.<env>.yaml (dump-all; no mappings here).
    # Keep MCP client secret ONLY under identity-oidc.

    observability:
      mappings:
        LANGFUSE_PUBLIC_KEY: "LANGFUSE_PUBLIC_KEY"
        LANGFUSE_SECRET_KEY: "LANGFUSE_SECRET_KEY"

    llm-api-keys:
      mappings:
        LITELLM_MASTER_KEY: "LITELLM_MASTER_KEY"

    identity-oidc:
      mappings:
        AM_MCP_CLIENT_ID: "AM_MCP_CLIENT_ID"
        AM_MCP_CLIENT_SECRET: "AM_MCP_CLIENT_SECRET"

    otel:
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
