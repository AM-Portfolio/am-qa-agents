# Dev — am-qa-agents (am-apps-dev)
# One pod serves Specs (/spt-poc) + UI evidence (/ui-test).
# Vault: domain path runtime/modules/qa (not per-service). Legacy services/* untouched.
#
# IMPORTANT: secretPaths must include mappings here (not only in vault-mappings.yaml).
# CI/amctl apply order is values.yaml → vault-mappings.yaml → values.dev.yaml;
# a path-only entry in this file would wipe mappings and dump ALL KV keys, which
# previously overwrote identity-oidc's AM_MCP_CLIENT_SECRET with a bad qa-path secret
# and caused Keycloak 401 on am-dev-realm.
environment: dev
replicaCount: 1

vault:
  enabled: true
  secretPaths:
    otel:
      path: "apps/data/dev/infra/observability"
      mappings:
        TRACING_SAMPLING_PROBABILITY: "TRACING_SAMPLING_PROBABILITY"
    # Live KV still under apps/dev/services/* (apps/data/dev/services/* not seeded)
    observability:
      path: "apps/dev/services/am-agents-mcp-gateway"
      mappings:
        LANGFUSE_PUBLIC_KEY: "LANGFUSE_PUBLIC_KEY"
        LANGFUSE_SECRET_KEY: "LANGFUSE_SECRET_KEY"
    llm-api-keys:
      path: "apps/dev/services/am-agents-mcp-gateway"
      mappings:
        LITELLM_MASTER_KEY: "LITELLM_MASTER_KEY"
    identity-oidc:
      path: "apps/dev/services/am-identity"
      mappings:
        # Only identity owns MCP client credentials (am-dev-realm)
        AM_MCP_CLIENT_ID: "AM_MCP_CLIENT_ID"
        AM_MCP_CLIENT_SECRET: "AM_MCP_CLIENT_SECRET"
    qa-agent:
      # Vault UI path: apps / dev / runtime / modules / qa
      # (KV v2). Do not use apps/data/dev/... as a separate duplicate path.
      path: "apps/dev/runtime/modules/qa"
      # Intentionally no mappings: dump all keys from this KV.
      # Do NOT store AM_MCP_CLIENT_SECRET here (identity-oidc owns MCP creds).

ingress:
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      am-apps-dev-dev-global-cors@kubernetescrd,
      am-apps-dev-dev-strip-prefix@kubernetescrd
  hosts:
    - host: am-dev.asrax.in
      paths:
        - path: /spt-poc
          pathType: Prefix
        - path: /ui-test
          pathType: Prefix

env:
  APP_ENV: dev
  QA_AGENT_ENV: dev
  APP_NAME: am-qa-agents
  DEFAULT_ENVIRONMENT: dev
  ROOT_PATH: /spt-poc
  LOG_LEVEL: INFO
  # Must exist in Temporal cluster (create qa-agent-dev before switching back)
  TEMPORAL_NAMESPACE: qa-agent
  QA_AGENT_WORKER_ENABLED: "1"
  FIN_AGENT_BASE_URL: "http://am-fin-agent.am-ai.svc.cluster.local:8100"
  TOOL_AGENT_BASE_URL: "http://am-tool-agent.am-apps-dev.svc.cluster.local:8141"
  # GitNexus currently down — empty disables GNX fallback (no hang on dead host)
  GNX_MCP_URL: ""
  # Until image with gnx_disabled lands: skip observe→GNX hang (tool-agent/template only)
  QA_AGENT_SKIP_OBSERVE: "true"
  QA_AGENT_OBSERVE_FORCE_TEMPLATE: "true"
  # MCP gateway client_credentials (must match Vault AM_MCP_CLIENT_SECRET realm)
  KEYCLOAK_TOKEN_URL: "http://auth.munish.org/auth/realms/am-dev-realm/protocol/openid-connect/token"
  AM_MCP_CLIENT_ID: "am-mcp-service"
  SPT_PUBLIC_BASE_URL: "https://am-dev.asrax.in/spt-poc"
  SPT_UI_TEST_AGENT_URL: "http://127.0.0.1:8150"
  UI_TEST_AGENT_URL: "http://127.0.0.1:8150"
  UI_TEST_AGENT_BASE_URL: "http://127.0.0.1:8150"
  SPT_PORTAL_FLUTTER: "true"
  # Soft dependency — avoid localhost default noise in cluster
  QDRANT_HOST: "qdrant.am-ai.svc.cluster.local"
